<div th:fragment="content" id="login-view">

  <!-- White card -->
  <div class="login-card">

    <!-- CiviForm logo -->
    <div class="flex justify-center mb-6">
      <img src="/assets/images/civiform-logo.png"
           alt="CiviForm"
           class="h-16 w-auto"
           onerror="this.style.display='none'; document.getElementById('pin-logo-text').style.display='block'" />
      <div id="pin-logo-text" style="display:none; color:#1a4480; font-size:1.5rem; font-weight:bold; line-height:1.1; text-align:center;">
        Civi<br/>Form
      </div>
    </div>

    <h1 class="text-2xl font-bold text-center text-gray-900 mb-1"
        th:text="${model.cityName}">Burlington, VT</h1>
    <p class="text-center text-gray-500 mb-8">Enter password to launch demo</p>

    <!-- Error banner -->
    <div th:if="${model.error != null}"
         role="alert"
         class="w-full mb-6 px-4 py-3 bg-red-50 border border-red-200 rounded text-sm text-red-700"
         th:text="${model.error}">
    </div>

    <!-- Demo URL (read-only) -->
    <div class="w-full mb-4">
      <label class="usa-label text-sm text-gray-500">Demo URL</label>
      <input
        type="text"
        readonly
        class="usa-input bg-gray-100 text-gray-600 text-sm font-mono cursor-default w-full"
        th:value="|/sandboxes/${model.sandboxId}/access|"
        aria-label="Demo URL"
      />
    </div>

    <!-- PIN form -->
    <form th:action="|/sandboxes/${model.sandboxId}/access|" method="POST" class="w-full">
      <input type="hidden" name="csrfToken" th:value="${templateGlobals.csrfToken}" />
      <input type="hidden" name="redirect" th:value="${model.redirectUrl}" />

      <div class="mb-6">
        <label for="pin" class="usa-label text-sm text-gray-500">Access PIN</label>
        <input
          id="pin"
          name="pin"
          type="password"
          inputmode="numeric"
          pattern="[0-9]{6}"
          maxlength="6"
          placeholder="••••••"
          autocomplete="off"
          required
          class="usa-input text-2xl tracking-widest text-center font-mono w-full"
          aria-label="6-digit access PIN"
        />
      </div>

      <button type="submit" class="usa-button w-full text-center font-semibold py-3">
        Continue
      </button>
    </form>

    <!-- Footer note -->
    <p class="text-center text-xs text-gray-400 mt-6">
      This is a demo environment. Do not enter real resident information.
    </p>
  </div>
</div>
