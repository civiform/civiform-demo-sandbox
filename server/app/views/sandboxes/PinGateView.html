<div th:fragment="content" class="min-h-screen bg-slate-50 flex items-center justify-center py-12 px-4">
  <div class="max-w-md w-full">

    <!-- Header -->
    <div class="text-center mb-8">
      <div class="text-5xl mb-4">🏛️</div>
      <h1 class="text-2xl font-bold text-gray-900">CiviForm Demo</h1>
      <p class="mt-2 text-gray-600"
         th:text="${model.cityName} + ' Sandbox'">Burlington, VT Sandbox</p>
    </div>

    <!-- Card -->
    <div class="cf-card">
      <h2 class="text-lg font-semibold text-gray-900 mb-1">Enter Access PIN</h2>
      <p class="text-sm text-gray-500 mb-6">
        Enter the 6-digit PIN shared by your Exygy contact to access this demo.
      </p>

      <!-- Error banner -->
      <div th:if="${model.error != null}"
           role="alert"
           class="mb-4 px-4 py-3 bg-red-50 border border-red-200 rounded text-sm text-red-700"
           th:text="${model.error}">
      </div>

      <form th:action="|/sandboxes/${model.sandboxId}/access|" method="POST">
        <div class="mb-4">
          <label for="pin" class="usa-label">Access PIN</label>
          <input
            id="pin"
            name="pin"
            type="text"
            inputmode="numeric"
            pattern="[0-9]{6}"
            maxlength="6"
            placeholder="000000"
            autocomplete="off"
            required
            class="usa-input text-2xl tracking-widest text-center font-mono"
            aria-label="6-digit access PIN"
          />
        </div>
        <button type="submit" class="usa-button w-full">
          Access Demo →
        </button>
      </form>
    </div>

    <p class="mt-6 text-center text-xs text-gray-400">
      This is a demo environment. Do not enter real resident information.
    </p>
  </div>
</div>
