<div th:fragment="content" class="grid-container py-8">
  <!-- Page Header -->
  <div class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
    <div>
      <h1 class="text-3xl font-bold text-gray-900" th:text="#{devtools.title}">Dev tools</h1>
    </div>
    <div class="flex items-center gap-3">
      <a
        href="/sandboxes"
        class="usa-button usa-button--outline no-underline"
        th:text="'← ' + #{devtools.backToSandboxes}"
      >
        ← All Sandboxes
      </a>
    </div>
  </div>

  <!-- Flash: success -->
  <div
    th:if="${flash != null && #maps.containsKey(flash, 'success')}"
    role="status"
    class="mb-6 px-4 py-3 bg-green-50 border border-green-200 rounded-lg text-sm text-green-800 flex items-center gap-2"
  >
    <span aria-hidden="true">✓</span>
    <span th:text="${flash['success']}"></span>
  </div>

  <!-- Flash: error -->
  <div
    th:if="${flash != null && #maps.containsKey(flash, 'error')}"
    role="alert"
    class="mb-6 px-4 py-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-800 flex items-center gap-2"
  >
    <span aria-hidden="true">✗</span>
    <span th:text="${flash['error']}"></span>
  </div>

  <!-- Tools Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <!-- Durable Jobs Tool -->
    <section class="cf-card flex flex-col gap-4" aria-labelledby="durable-jobs-heading">
      <div>
        <h2 id="durable-jobs-heading" class="text-xl font-bold text-gray-900 mb-1" th:text="#{devtools.jobs.title}">
          Durable Jobs
        </h2>
        <p class="text-sm text-gray-600" th:text="#{devtools.jobs.description}">
          Manually run the selected job immediately.
        </p>
      </div>

      <form method="POST" th:action="${model.runDurableJobUrl}" class="flex flex-col gap-4">
        <input type="hidden" name="csrfToken" th:value="${templateGlobals.csrfToken}" />

        <div>
          <label
            for="durable-job-select"
            class="usa-label mt-0 font-semibold text-gray-900"
            th:text="#{devtools.jobs.select}"
          >
            Choose job to run once
          </label>
          <select
            id="durable-job-select"
            name="durableJobSelect"
            class="usa-select mt-1 w-full"
            th:disabled="${model.durableJobNames.isEmpty()}"
          >
            <option
              th:if="${model.durableJobNames.isEmpty()}"
              value=""
              th:text="#{devtools.jobs.empty}"
            >
              No durable jobs are registered.
            </option>
            <option
              th:each="jobName : ${model.durableJobNames}"
              th:value="${jobName}"
              th:text="${jobName}"
            ></option>
          </select>
        </div>

        <div>
          <button
            id="run-durable-job-button"
            type="submit"
            class="usa-button w-full"
            th:disabled="${model.durableJobNames.isEmpty()}"
            th:text="#{devtools.jobs.run}"
          >
            Run job
          </button>
        </div>
      </form>
    </section>
  </div>
</div>
