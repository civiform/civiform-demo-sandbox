<div th:fragment="content" id="login-view">

  <!-- White card -->
  <div class="login-card">

    <!-- CiviForm logo (falls back to text if image missing) -->
    <div class="flex justify-center mb-6">
      <img src="/assets/images/civiform-logo.png"
           alt="CiviForm"
           class="h-16 w-auto"
           onerror="this.style.display='none'; document.getElementById('logo-text').style.display='block'" />
      <div id="logo-text" style="display:none; color:#1a4480; font-size:1.5rem; font-weight:bold; line-height:1.1; text-align:center;">
        Civi<br/>Form
      </div>
    </div>

    <h1 class="text-2xl font-bold text-center text-gray-900 mb-1">CiviForm Demo Portal</h1>
    <p class="text-center text-gray-500 mb-8">Log in to continue</p>

    <!-- Error banner -->
    <div th:if="${model.error != null}"
         role="alert"
         class="w-full mb-6 px-4 py-3 bg-red-50 border border-red-200 rounded text-sm text-red-700"
         th:text="${model.error}">
    </div>

    <!-- Login form -->
    <form action="/login" method="POST" class="w-full">

      <div class="mb-4">
        <label for="email" class="usa-label font-medium text-gray-700">
          Email address<span class="text-red-500 ml-0.5">*</span>
        </label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
          class="usa-input mt-1 w-full"
          th:value="${model.email}"
        />
      </div>

      <div class="mb-6">
        <label for="password" class="usa-label font-medium text-gray-700">
          Password<span class="text-red-500 ml-0.5">*</span>
        </label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          class="usa-input mt-1 w-full"
        />
      </div>

      <button type="submit" class="usa-button w-full text-center font-semibold py-3">
        Continue
      </button>
    </form>

    <!-- Sign up stub -->
    <p class="text-center text-sm text-gray-500 mt-4">
      Don't have an account?
      <a href="#" class="text-blue-600 hover:underline" aria-disabled="true" tabindex="-1">Sign up</a>
    </p>

    <!-- OR divider -->
    <div class="flex items-center my-6 w-full">
      <div class="flex-grow border-t border-gray-200"></div>
      <span class="mx-3 text-xs text-gray-400 font-medium tracking-widest">OR</span>
      <div class="flex-grow border-t border-gray-200"></div>
    </div>

    <!-- Google stub button (non-functional) -->
    <button
      type="button"
      disabled
      aria-disabled="true"
      aria-label="Continue with Google — not available"
      class="btn-google w-full opacity-60 cursor-not-allowed"
    >
      <!-- Google G icon -->
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>

  </div>
</div>
