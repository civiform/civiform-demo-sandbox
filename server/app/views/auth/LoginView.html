<div th:fragment="content" id="login-view">

  <!-- White card -->
  <div class="login-card">

    <!-- CiviForm logo (falls back to text if image missing) -->
    <div class="flex justify-center mb-6">
      <img src="/assets/images/civiform-logo.png"
           alt="CiviForm"
           class="h-16 w-auto"
           onerror="this.style.display='none'; document.getElementById('logo-text').style.display='block'" />
      <div id="logo-text" style="display:none; color:#1a4480; font-size:1.5rem; font-weight:bold; line-height:1.1; text-align:center;">
        Civi<br/>Form
      </div>
    </div>

    <h1 class="text-2xl font-bold text-center text-gray-900 mb-1">CiviForm Demo Portal</h1>
    <p class="text-center text-gray-500 mb-8">Log in to continue</p>

    <!-- Error banner -->
    <div th:if="${model.error != null}"
         role="alert"
         class="w-full mb-6 px-4 py-3 bg-red-50 border border-red-200 rounded text-sm text-red-700"
         th:text="${model.error}">
    </div>

    <!-- Auth0 OIDC button (shown only when Auth0 is active) -->
    <a
      th:if="${model.auth0Enabled}"
      href="/login/auth0"
      aria-label="Continue with Auth0"
      class="btn-google w-full"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path fill="#EB5424" d="M21.98 7.448L19.62 0H4.347L2.02 7.448c-1.352 4.312.03 9.206 3.815 12.015L12.007 24l6.157-4.552c3.755-2.81 5.182-7.688 3.815-12.015l-6.16 4.58 2.343 7.45-6.157-4.597-6.158 4.58 2.358-7.433-6.188-4.55 7.63-.045L12.008 0l2.356 7.404 7.615.044z"/>
      </svg>
      Continue with Auth0
    </a>

    <!-- Development email/password form (shown only when Auth0 is not configured) -->
    <form th:unless="${model.auth0Enabled}" action="/login" method="POST" class="w-full">
      <input type="hidden" name="csrfToken" th:value="${templateGlobals.csrfToken}" />

      <div class="mb-4">
        <label for="email" class="usa-label font-medium text-gray-700">
          Email address<span class="text-red-500 ml-0.5">*</span>
        </label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
          class="usa-input mt-1 w-full"
          th:value="${model.email}"
        />
      </div>

      <div class="mb-6">
        <label for="password" class="usa-label font-medium text-gray-700">
          Password<span class="text-red-500 ml-0.5">*</span>
        </label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          class="usa-input mt-1 w-full"
        />
      </div>

      <button type="submit" class="usa-button w-full text-center font-semibold py-3">
        Continue
      </button>
    </form>

  </div>
</div>
