<th:block>
  <footer class="usa-footer bg-gray-900 text-gray-300 mt-auto py-8">
    <div class="grid-container">
      <div class="grid-row grid-gap items-center justify-between">
        <div class="grid-col-12 tablet:grid-col-6">
          <h3 class="text-lg font-bold text-white mb-2">CiviForm Sandbox Builder</h3>
          <p class="text-sm text-gray-400">
            Open-source tool to rapidly deploy and manage sandbox environments for CiviForm benefits application platform.
          </p>
        </div>
        <div class="grid-col-12 tablet:grid-col-6 text-right">
          <p class="text-xs text-gray-400">
            Built with Play Framework, Thymeleaf, USWDS, and Containers.
          </p>
          <p class="mt-2">
            <a
              id="dev-tools-link"
              href="/dev"
              class="text-sm text-gray-300 hover:text-white underline"
              th:text="#{footer.devtools}"
            >Dev tools</a>
          </p>
        </div>
      </div>
    </div>
  </footer>
</th:block>
