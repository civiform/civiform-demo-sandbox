# Main Play Framework configuration for Civiform Sandbox Builder

play.http.secret.key = "changeme"
play.http.secret.key = ${?APPLICATION_SECRET}

# Portal auth — MVP: single shared account (admin@civiform.dev + this password)
# Set DEMO_PORTAL_PASSWORD env var in production. If unset, login is always rejected.
portal.password = ""
portal.password = ${?DEMO_PORTAL_PASSWORD}

# Enabled modules
play.modules.enabled += "modules.ThymeleafModule"
play.modules.enabled += "modules.MainModule"

# Internationalization
play.i18n.langs = ["en"]

# Static Assets
play.assets {
  path = "/public"
  urlPrefix = "/assets"
}

# Filters & Security
play.filters {
  disabled += "play.filters.csrf.CSRFFilter"
  hosts {
    allowed = ["."]
  }
  headers {
    contentSecurityPolicy = null
  }
}

# Application Base URL
app.baseUrl = "http://localhost:9000"
app.baseUrl = ${?APP_BASE_URL}

# Database (Play JDBC connection pool → sandbox_builder Postgres)
db.default.driver   = org.postgresql.Driver
db.default.url      = "jdbc:postgresql://localhost:5432/sandbox_builder"
db.default.url      = ${?DB_JDBC_URL}
db.default.username = "postgres"
db.default.username = ${?DB_USER}
db.default.password = "example"
db.default.password = ${?DB_PASSWORD}

# Docker socket path (overridable for non-standard setups)
docker.socketPath = "unix:///var/run/docker.sock"
docker.socketPath = ${?DOCKER_SOCKET_PATH}

# CiviForm image to launch per sandbox
sandbox.civiformImage = "civiform/civiform:latest"
sandbox.civiformImage = ${?CIVIFORM_IMAGE}

# Host where the builder Postgres is reachable FROM inside the CiviForm container
# On Mac Docker Desktop use host.docker.internal; on Linux use the bridge IP
sandbox.dbHost = "host.docker.internal"
sandbox.dbHost = ${?SANDBOX_DB_HOST}

# ── Runtime selector ──────────────────────────────────────────────────────────
# "docker"    → DockerSandboxService     (local dev — no AWS required)
# "terraform" → TerraformSandboxService  (AWS — runs terraform/sandbox per sandbox)
#
# "docker" is the default because it is the only runtime that works with no AWS
# credentials, which is what the test suite and a clean checkout have. Override
# per-shell with SANDBOX_RUNTIME rather than editing this line — docker-compose
# passes it through.
sandbox.runtime = "docker"
sandbox.runtime = ${?SANDBOX_RUNTIME}

# ── Terraform runtime ─────────────────────────────────────────────────────────
# All required when sandbox.runtime = "terraform". Unread when runtime = "docker".

sandbox.aws.region = "us-east-1"
sandbox.aws.region = ${?AWS_REGION}

sandbox.terraform.binary = "terraform"
sandbox.terraform.binary = ${?TERRAFORM_BINARY}

# Root module copied into a fresh temp dir for each provisioning job.
sandbox.terraform.moduleDir = "/app/terraform/sandbox"
sandbox.terraform.moduleDir = ${?TERRAFORM_MODULE_DIR}

# State bucket created by terraform/bootstrap. Each sandbox gets its own key:
# sandboxes/<sandbox-id>/terraform.tfstate
sandbox.terraform.stateBucket = "civiform-sandbox-tfstate"
sandbox.terraform.stateBucket = ${?TERRAFORM_STATE_BUCKET}

# Shared infrastructure IDs, as produced by:
#   terraform -chdir=terraform output -json > platform-outputs.json
#
# A generated file rather than a dozen config keys. These values are already
# published as Terraform outputs; restating them here by hand would create a
# second source of truth that silently drifts the first time the platform stack
# is reapplied — and the symptom would be an apply failing several minutes in.
sandbox.terraform.platformOutputsFile = "/app/platform-outputs.json"
sandbox.terraform.platformOutputsFile = ${?PLATFORM_OUTPUTS_FILE}

# Pinned per sandbox at creation and never changed for its 30-day life.
sandbox.terraform.civiformImageTag = "latest"
sandbox.terraform.civiformImageTag = ${?CIVIFORM_IMAGE_TAG}

# An apply creates an ECS service and waits for it to stabilise. Generous, but
# finite: without a ceiling a wedged apply holds its state lock indefinitely and
# blocks every retry for that sandbox.
sandbox.terraform.timeoutMinutes = 45
sandbox.terraform.timeoutMinutes = ${?TERRAFORM_TIMEOUT_MINUTES}

# ── Shared RDS admin credentials ──────────────────────────────────────────────
# Used only to CREATE/DROP the per-sandbox database and role. Distinct from the
# builder's own db.default.* connection: in AWS the builder's metadata database
# and the sandbox RDS instance are different servers.
#
# Injected from Secrets Manager by the task definition. Never commit a value.
sandbox.rds.adminDatabase = "postgres"
sandbox.rds.adminDatabase = ${?RDS_ADMIN_DATABASE}

sandbox.rds.adminUser = "sandbox_master"
sandbox.rds.adminUser = ${?RDS_ADMIN_USER}

sandbox.rds.adminPassword = ""
sandbox.rds.adminPassword = ${?RDS_ADMIN_PASSWORD}

# Where the builder reaches RDS to run those CREATE/DROP statements.
#
# Empty means "use rds_endpoint from the platform outputs", which is correct in
# AWS: the builder runs as an ECS task in the same VPC and talks to RDS directly.
#
# Set these only to route the admin connection somewhere else than the sandbox
# task's own connection. The case that matters is local development: RDS is not
# publicly accessible, so a developer tunnels to it with
#
#   ./bin/rds-tunnel
#
# and then sets RDS_ADMIN_HOST=host.docker.internal, RDS_ADMIN_PORT=15432.
#
# That script wraps `aws ssm start-session` with a relay, which is not optional:
# session-manager-plugin binds the forwarded port to 127.0.0.1, and the builder
# container resolves host.docker.internal to the bridge gateway, so a bare
# port-forward is refused even though it works from the host.
#
# Editing rds_endpoint in the platform outputs file would look equivalent and is
# not: that value is also handed to the sandbox stack as db_address, so it would
# tell the deployed ECS task to connect to the developer's laptop.
sandbox.rds.adminHost = ""
sandbox.rds.adminHost = ${?RDS_ADMIN_HOST}

sandbox.rds.adminPort = 5432
sandbox.rds.adminPort = ${?RDS_ADMIN_PORT}

# NOTE: the former sandbox.ecs.*, sandbox.alb.listener_arn and sandbox.rds.host
# settings are gone. They belonged to the AWS-SDK implementation, which built
# task definitions and listener rules by hand. Those values now reach the
# sandbox through Terraform: infrastructure IDs come from the platform outputs
# file above, and task sizing is a variable on the terraform/sandbox module.

