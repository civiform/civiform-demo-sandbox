# Main Play Framework configuration for Civiform Sandbox Builder

play.http.secret.key = "changeme"
play.http.secret.key = ${?APPLICATION_SECRET}

# Enabled modules
play.modules.enabled += "modules.ThymeleafModule"
play.modules.enabled += "modules.MainModule"

# Internationalization
play.i18n.langs = ["en"]

# Static Assets
play.assets {
  path = "/public"
  urlPrefix = "/assets"
}

# Filters & Security
play.filters {
  disabled += "play.filters.csrf.CSRFFilter"
  hosts {
    allowed = ["."]
  }
  headers {
    contentSecurityPolicy = null
  }
}

# Application Base URL
app.baseUrl = "http://localhost:9000"
app.baseUrl = ${?APP_BASE_URL}

# Database (Play JDBC connection pool → sandbox_builder Postgres)
db.default.driver   = org.postgresql.Driver
db.default.url      = "jdbc:postgresql://localhost:5432/sandbox_builder"
db.default.url      = ${?DB_JDBC_URL}
db.default.username = "postgres"
db.default.username = ${?DB_USER}
db.default.password = "example"
db.default.password = ${?DB_PASSWORD}

# Docker socket path (overridable for non-standard setups)
docker.socketPath = "unix:///var/run/docker.sock"
docker.socketPath = ${?DOCKER_SOCKET_PATH}

# CiviForm image to launch per sandbox
sandbox.civiformImage = "civiform/civiform:latest"
sandbox.civiformImage = ${?CIVIFORM_IMAGE}

# Host where the builder Postgres is reachable FROM inside the CiviForm container
# On Mac Docker Desktop use host.docker.internal; on Linux use the bridge IP
sandbox.dbHost = "host.docker.internal"
sandbox.dbHost = ${?SANDBOX_DB_HOST}

# ── Runtime selector ──────────────────────────────────────────────────────────
# "docker"  → DockerSandboxService  (Sprint 1 — local dev)
# "fargate" → EcsFargateSandboxService (Sprint 2 — AWS production)
sandbox.runtime = "docker"
sandbox.runtime = ${?SANDBOX_RUNTIME}

# ── Sprint 2: ECS Fargate + AWS config ───────────────────────────────────────
# All required when sandbox.runtime = "fargate". No-ops when runtime = "docker".

sandbox.aws.region = "us-east-1"
sandbox.aws.region = ${?AWS_REGION}

# Fixed URL shared by all sandboxes — city branding via WHITELABEL env var, not subdomain
sandbox.url = "https://demo.sandbox.civiform.dev"
sandbox.url = ${?SANDBOX_URL}

sandbox.civiform_image = "civiform/civiform:latest"
sandbox.civiform_image = ${?CIVIFORM_IMAGE}

sandbox.ecs.cluster       = "civiform-sandbox-cluster"
sandbox.ecs.cluster       = ${?ECS_CLUSTER}

sandbox.ecs.subnets       = []   # override via ECS_SUBNETS env var (comma-separated)
# Note: set ECS_SUBNETS as a HOCON list: ["subnet-xxx","subnet-yyy"]

sandbox.ecs.security_group = ""
sandbox.ecs.security_group = ${?ECS_SECURITY_GROUP}

sandbox.ecs.execution_role = ""
sandbox.ecs.execution_role = ${?ECS_EXECUTION_ROLE_ARN}

sandbox.ecs.task_role      = ""
sandbox.ecs.task_role      = ${?ECS_TASK_ROLE_ARN}

sandbox.ecs.log_group      = "/ecs/civiform-sandbox"
sandbox.ecs.log_group      = ${?ECS_LOG_GROUP}

sandbox.ecs.task_cpu       = 512
sandbox.ecs.task_memory    = 1024

sandbox.alb.target_group = ""
sandbox.alb.target_group = ${?ALB_TARGET_GROUP_ARN}

sandbox.rds.host           = ""
sandbox.rds.host           = ${?RDS_HOST}

sandbox.rds.port           = 5432

sandbox.rds.dbname         = "civiform_sandbox"
sandbox.rds.dbname         = ${?RDS_DBNAME}

sandbox.rds.master_secret  = ""
sandbox.rds.master_secret  = ${?RDS_MASTER_SECRET_ARN}
