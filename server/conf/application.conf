# Main Play Framework configuration for Civiform Sandbox Builder

play.http.secret.key = "changeme"
play.http.secret.key = ${?APPLICATION_SECRET}

# Enabled modules
play.modules.enabled += "modules.ThymeleafModule"
play.modules.enabled += "modules.MainModule"

# Internationalization
play.i18n.langs = ["en"]

# Static Assets
play.assets {
  path = "/public"
  urlPrefix = "/assets"
}

# Filters & Security
play.filters {
  disabled += "play.filters.csrf.CSRFFilter"
  hosts {
    allowed = ["."]
  }
  headers {
    contentSecurityPolicy = null
  }
}

# Application Base URL
app.baseUrl = "http://localhost:9000"
app.baseUrl = ${?APP_BASE_URL}
